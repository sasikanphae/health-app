<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f9d76">
  <meta name="description" content="สมุดสุขภาพส่วนตัว บันทึกได้ในแตะเดียว">
  <title>สุขภาพดี</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Due reminders, shown on every tab -->
  <div id="alerts" class="alerts" aria-live="polite"></div>

  <main>
    <section id="view-home" class="view active" aria-label="วันนี้"></section>
    <section id="view-gym" class="view" aria-label="คู่มือเครื่องเล่น"></section>
    <section id="view-prep" class="view" aria-label="เตรียมของไปยิม"></section>
    <section id="view-settings" class="view" aria-label="ตั้งค่า"></section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-act="tab" data-view="home" aria-selected="true">🏠<span>วันนี้</span></button>
    <button role="tab" data-act="tab" data-view="gym" aria-selected="false">🏋️<span>เครื่องเล่น</span></button>
    <button role="tab" data-act="tab" data-view="prep" aria-selected="false">🎒<span>เตรียมของ</span></button>
    <button role="tab" data-act="tab" data-view="settings" aria-selected="false">⚙️<span>ตั้งค่า</span></button>
  </nav>

  <!-- Full-screen sheet for the check-in flow and machine details -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text"></span><button id="toast-undo" type="button" hidden>เลิกทำ</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
