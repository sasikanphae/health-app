<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4edde" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1b17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="แมวน้อยนั่งสมาธิช่วยจัดตารางออกกำลังกาย อาหาร และพาไปยิม แบบสบายใจ">
  <title>เหมียวสมาธิ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="เหมียวสมาธิ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Due reminders, shown on every tab -->
  <div id="alerts" class="alerts" aria-live="polite"></div>

  <main>
    <section id="view-today" class="view active" aria-label="วันนี้"></section>
    <section id="view-week" class="view" aria-label="ปฏิทิน"></section>
    <section id="view-food" class="view" aria-label="แผนอาหาร"></section>
    <section id="view-gym" class="view" aria-label="ยิม"></section>
    <section id="view-me" class="view" aria-label="ของฉัน"></section>
    <section id="view-life" class="view" aria-label="ธุระ"></section>
    <section id="view-settings" class="view" aria-label="ตั้งค่า"></section>
  </main>

  <nav class="tabs" role="tablist">
    <button role="tab" data-act="tab" data-view="today" aria-selected="true"><span>วันนี้</span></button>
    <button role="tab" data-act="tab" data-view="week" aria-selected="false"><span>ปฏิทิน</span></button>
    <button role="tab" data-act="tab" data-view="food" aria-selected="false"><span>อาหาร</span></button>
    <button role="tab" data-act="tab" data-view="gym" aria-selected="false"><span>ยิม</span></button>
    <button role="tab" data-act="tab" data-view="life" aria-selected="false"><span>ธุระ</span></button>
    <button role="tab" data-act="tab" data-view="me" aria-selected="false"><span>ของฉัน</span></button>
  </nav>

  <!-- Full-screen sheet: first-run questions, check-in, workout, exercise details -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- Rest timer, stays visible above everything while counting down -->
  <div id="timer" class="timer" role="timer" aria-live="off" hidden></div>

  <!-- Quick note: reachable from every page, opens over the current screen -->
  <!-- "จัดการให้หน่อย": one button that does the right job for the page you're on -->
  <button id="fab-magic" class="fab-magic" type="button" data-act="magic" aria-label="จัดการให้หน่อย" hidden></button>
  <button id="fab-note" class="fab" type="button" data-act="noteOpen" aria-label="โยนไว้ก่อน"></button>
  <div id="quicknote" class="quicknote" role="dialog" aria-label="โยนไว้ก่อน" hidden>
    <form data-form="note">
      <div class="row between"><span class="head qn-title">โยนไว้ก่อน</span>
        <button type="button" class="icon-btn" data-act="noteClose" aria-label="ปิด">✕</button></div>
      <textarea name="text" rows="4" maxlength="2000" placeholder="พิมพ์หรือพูดอะไรก็ได้ เช่น &quot;พรุ่งนี้โทรหาแม่ แล้วซื้อแชมพู&quot; แมวจัดหมวดให้เอง"></textarea>
      <div class="row">
        <button type="button" class="btn soft mic-btn" data-act="mic" aria-label="พูดแทนพิมพ์"></button>
        <button class="btn primary grow">ใส่</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text"></span><button id="toast-undo" type="button" hidden>เลิกทำ</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
